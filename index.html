<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>弓道フォーム確認・比較 Webアプリ</title>
<style>
:root{--ac:#00e676;--cy:#22d3ee;--bd:#333}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#121212;color:#fff;font:14px/1.35 Roboto,"Noto Sans JP",sans-serif;display:flex;flex-direction:column;height:100dvh;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.hidden{display:none!important}
header{background:#1e1e1e;padding:6px 10px;display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between;align-items:center;border-bottom:1px solid var(--bd)}
h1{font-size:16px;color:var(--ac)}
nav{display:flex;gap:4px;background:#000;padding:3px;border-radius:8px}
nav button{border:0;background:none;color:#9ca3af;font-weight:700;font-size:13px;min-height:38px;padding:0 10px;border-radius:6px;cursor:pointer}
nav button.on{background:var(--ac);color:#000}
main{flex:1;min-height:0;position:relative;background:#000;overflow:hidden}
#single,#cmp{position:absolute;inset:0}

/* モード1・2 メディアレイヤー */
.media-container{position:absolute;inset:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#single video,#single canvas,#ghost-img,#ghost-vid{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.vh{opacity:0;pointer-events:none}
.mir{transform:scaleX(-1)}
.zoom-target{transition:transform 0.1s ease-out;transform-origin:center center}

/* 比較モードレイアウト */
#cmp{position:absolute;inset:0}
.cmp-box{position:relative;width:100%;height:100%;overflow:hidden}
#cmp.side{display:flex}
#cmp.side .cmp-box{flex:1 1 50%;width:50%;height:100%}
#cmp.side #box-a{border-right:1px solid var(--bd)}
/* 重ね表示・並列表示共通の動画配置 */
#cmp video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#box-a video{z-index:1}
#box-b video{z-index:2}

/* 格子グリッド表示 */
.grid-svg{position:absolute;inset:0;z-index:50;pointer-events:none;display:none;width:100%;height:100%}
.grid-svg.on{display:block}

#ov{position:absolute;inset:0;z-index:60;background:rgba(0,0,0,.7);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;font-size:20px;font-weight:700;color:var(--ac)}
#rec{position:absolute;top:10px;left:10px;z-index:55;background:#dc2626;border:1px solid #f87171;padding:4px 10px;border-radius:999px;font-weight:700;font-size:13px;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.35}}

footer{background:#1e1e1e;border-top:1px solid var(--bd);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;max-height:48dvh;overflow:auto}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.box{display:flex;flex-direction:column;gap:6px}
.btn{min-height:42px;padding:0 10px;border-radius:8px;border:1px solid #555;background:#2a2a2a;color:#fff;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.btn.on{border-color:var(--ac);color:var(--ac)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#000}
.btn.rec{background:#dc2626;border-color:#dc2626}
.btn.big{flex:1;min-height:48px;font-size:15px}
.btn.sm{min-height:36px;padding:0 8px;font-size:12px}
.btn:disabled{opacity:.4;pointer-events:none}
input[type=range]{flex:1;min-width:70px;height:32px;accent-color:var(--ac)}
#ob,#ghost-ob{accent-color:var(--cy)}

.clip{background:#121212;border:1px solid var(--bd);border-radius:8px;padding:4px 6px;display:flex;flex-direction:column;gap:4px}
.clip-row{display:flex;align-items:center;gap:4px;width:100%}
.clip-row>b{width:16px;text-align:center}
.btn.ic{min-height:36px;min-width:36px;padding:0;font-size:15px}

@media (max-width:600px){h1{display:none}header{justify-content:center;padding:4px 6px}}
@media (orientation:landscape) and (max-height:520px){
body{display:grid;grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:auto minmax(0,1fr)}
header{grid-column:1/3;justify-content:center;padding:4px 6px}h1{display:none}
main{grid-column:1;grid-row:2}footer{grid-column:2;grid-row:2;max-height:none;border-top:0;border-left:1px solid var(--bd)}}
</style>
</head>
<body>
<header>
  <h1>🎯 弓道フォーム確認・比較</h1>
  <nav>
    <button id="n-m1" class="on" onclick="setMode('m1')">1 遅延</button>
    <button id="n-m2" onclick="setMode('m2')">2 撮影</button>
    <button id="n-m3" onclick="setMode('m3')">3 比較</button>
  </nav>
</header>

<main>
  <!-- 共通単一グリッド -->
  <svg id="grid-main" class="grid-svg" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="sq-pattern-main" width="60" height="60" patternUnits="userSpaceOnUse" x="50%" y="50%">
        <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1" stroke-dasharray="3 3"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#sq-pattern-main)"/>
    <line x1="50%" y1="0" x2="50%" y2="100%" stroke="rgba(0,230,118,0.8)" stroke-width="1"/>
    <line x1="0" y1="50%" x2="100%" y2="50%" stroke="rgba(0,230,118,0.8)" stroke-width="1"/>
  </svg>

  <div id="single">
    <div class="media-container zoom-target" id="zoom-layer">
      <video id="live" autoplay playsinline muted></video>
      <canvas id="dc" class="hidden"></canvas>
      <video id="pb" class="hidden" playsinline muted loop></video>
      
      <!-- モード2: 基準ゴースト透かし表示レイヤー -->
      <img id="ghost-img" class="hidden" style="opacity:0.35;pointer-events:none;z-index:10;">
      <video id="ghost-vid" class="hidden" autoplay playsinline muted loop style="opacity:0.35;pointer-events:none;z-index:10;"></video>
    </div>

    <div id="rec" class="hidden">● 録画中 (REC)</div>
    <div id="ov" class="hidden"><span id="ovm"></span></div>
  </div>

  <div id="cmp" class="hidden">
    <div id="box-a" class="cmp-box">
      <video id="va" playsinline muted></video>
      <video id="vb" playsinline muted style="opacity:.5"></video>
      <svg id="grid-a" class="grid-svg" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="sq-pattern-a" width="50" height="50" patternUnits="userSpaceOnUse" x="50%" y="50%">
            <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1" stroke-dasharray="3 3"/>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#sq-pattern-a)"/>
        <line x1="50%" y1="0" x2="50%" y2="100%" stroke="rgba(0,230,118,0.8)" stroke-width="1"/>
        <line x1="0" y1="50%" x2="100%" y2="50%" stroke="rgba(0,230,118,0.8)" stroke-width="1"/>
      </svg>
    </div>
    <div id="box-b" class="cmp-box" style="display:none">
      <svg id="grid-b" class="grid-svg" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="sq-pattern-b" width="50" height="50" patternUnits="userSpaceOnUse" x="50%" y="50%">
            <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1" stroke-dasharray="3 3"/>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#sq-pattern-b)"/>
        <line x1="50%" y1="0" x2="50%" y2="100%" stroke="rgba(0,230,118,0.8)" stroke-width="1"/>
        <line x1="0" y1="50%" x2="100%" y2="50%" stroke="rgba(0,230,118,0.8)" stroke-width="1"/>
      </svg>
    </div>
  </div>
</main>

<footer>
  <div class="row">
    <button class="btn sm" id="camBtn" onclick="toggleCam()">📷 切替</button>
    <button class="btn sm" id="mirBtn" onclick="toggleMir()">↔️ 反転</button>
    <button class="btn sm" id="gridBtn" onclick="toggleGrid()">📐 グリッド</button>
    <div class="row" id="zoom-ctrl" style="flex:1;min-width:110px;">
      <label style="font-size:12px;white-space:nowrap;">🔍</label>
      <input type="range" id="zr" min="0.7" max="3.0" step="0.1" value="1.0" oninput="setZoom(this.value)">
      <b id="zl" style="color:var(--ac);min-width:32px;font-size:12px;">1.0x</b>
    </div>
  </div>

  <!-- モード1: 遅延モニター -->
  <section id="s-m1" class="box">
    <div class="row" style="justify-content:flex-end;margin-bottom:-4px;">
      <button class="btn sm" id="pt-m1" onclick="togglePanelMode('m1')">▼ 隠す</button>
    </div>
    <div id="content-m1" class="box" style="gap:6px">
      <div class="row"><label style="font-size:13px">遅延</label>
        <input type="range" id="dr" min="3" max="60" step="1" value="10" oninput="$('dl').textContent=this.value+'秒'">
        <b id="dl" style="color:var(--ac);min-width:40px;text-align:right">10秒</b></div>
      <button class="btn pri big" id="db" onclick="toggleDelay()">▶ 遅延再生開始</button>
    </div>
  </section>

  <!-- モード2: 撮影 -->
  <section id="s-m2" class="box hidden">
    <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:-2px;">
      <div class="row" style="gap:4px;">
        <button class="btn sm" id="ghostBtn" onclick="toggleGhost()">👻 透かしOFF</button>
        <label class="btn sm">📂 基準<input type="file" accept="video/*,image/*" hidden onchange="loadGhostFile(event)"></label>
      </div>
      <button class="btn sm" id="pt-m2" onclick="togglePanelMode('m2')">▼ 隠す</button>
    </div>
    <div id="content-m2" class="box" style="gap:6px">
      <div class="row">
        <label style="font-size:13px">タイマー</label>
        <input type="range" id="tr" min="0" max="10" step="1" value="3" oninput="$('tl').textContent=this.value+'秒'">
        <b id="tl" style="color:var(--ac);min-width:40px;text-align:right">3秒</b>
        <span style="font-size:11px;color:#9ca3af">濃さ</span>
        <input type="range" id="ghost-ob" min="0.1" max="0.8" step="0.05" value="0.35" style="max-width:80px;" oninput="setGhostOpacity(this.value)">
      </div>
      <div class="row">
        <button class="btn rec big" id="rb" onclick="recClick()">🔴 撮影開始</button>
        <button class="btn big hidden" id="rs" onclick="retake()">📷 再撮影</button>
        <button class="btn pri big" id="sv" onclick="save()" disabled>💾 保存</button>
      </div>
    </div>
  </section>

  <!-- モード3: 比較 -->
  <section id="s-m3" class="box hidden">
    <div class="row">
      <button class="btn pri sm" style="flex:1" onclick="syncPlay()">▶/⏸ 同期再生</button>
      <button class="btn sm" style="flex:1" id="vm" onclick="toggleView()">🔲 並列表示</button>
      <button class="btn sm" id="pt" onclick="togglePanel()">▼ 隠す</button>
    </div>
    <div id="clips" class="box" style="gap:4px">
      <!-- 動画A コントロール -->
      <div class="clip">
        <div class="clip-row">
          <b style="color:var(--ac)">A</b>
          <input type="range" id="sk-a" min="0" max="1" step="0.01" value="0" oninput="seekV('a',this.value)">
          <button class="btn ic sm" onclick="step('a',-0.1)">-0.1</button>
          <button class="btn ic sm" onclick="step('a',-1/30)">◀</button>
          <button class="btn ic sm" onclick="step('a',1/30)">▶</button>
          <button class="btn ic sm" onclick="step('a',0.1)">+0.1</button>
          <button class="btn ic sm" id="ma" onclick="mirV('a')">↔</button>
          <label class="btn ic sm">📂<input type="file" accept="video/*" hidden onchange="loadV('a',event)"></label>
        </div>
        <div class="clip-row" style="font-size:11px;">
          <button class="btn sm" style="min-height:30px;" onclick="setLoopBound('a','in')">In</button>
          <span id="in-txt-a" style="color:#aaa;">0.0s</span>
          <button class="btn sm" style="min-height:30px;" onclick="setLoopBound('a','out')">Out</button>
          <span id="out-txt-a" style="color:#aaa;">MAX</span>
          <button class="btn sm" style="min-height:30px;" onclick="resetLoop('a')">リセット</button>
        </div>
      </div>
      <!-- 動画B コントロール -->
      <div class="clip">
        <div class="clip-row">
          <b style="color:var(--cy)">B</b>
          <input type="range" id="sk-b" min="0" max="1" step="0.01" value="0" oninput="seekV('b',this.value)">
          <button class="btn ic sm" onclick="step('b',-0.1)">-0.1</button>
          <button class="btn ic sm" onclick="step('b',-1/30)">◀</button>
          <button class="btn ic sm" onclick="step('b',1/30)">▶</button>
          <button class="btn ic sm" onclick="step('b',0.1)">+0.1</button>
          <button class="btn ic sm" id="mb" onclick="mirV('b')">↔</button>
          <label class="btn ic sm">📂<input type="file" accept="video/*" hidden onchange="loadV('b',event)"></label>
        </div>
        <div class="clip-row" style="font-size:11px;">
          <button class="btn sm" style="min-height:30px;" onclick="setLoopBound('b','in')">In</button>
          <span id="in-txt-b" style="color:#aaa;">0.0s</span>
          <button class="btn sm" style="min-height:30px;" onclick="setLoopBound('b','out')">Out</button>
          <span id="out-txt-b" style="color:#aaa;">MAX</span>
          <button class="btn sm" style="min-height:30px;" onclick="resetLoop('b')">リセット</button>
        </div>
      </div>
      <div class="clip-row" style="background:#121212;padding:3px 6px;border-radius:6px;">
        <span style="font-size:12px;color:#9ca3af;white-space:nowrap">B 透明度</span>
        <input type="range" id="ob" min="0" max="1" step="0.05" value="0.5" oninput="vb.style.opacity=this.value">
      </div>
    </div>
  </section>
</footer>

<script>
const $=id=>document.getElementById(id);
const live=$('live'),dc=$('dc'),dctx=dc.getContext('2d'),pb=$('pb'),va=$('va'),vb=$('vb');
const ghostImg=$('ghost-img'),ghostVid=$('ghost-vid'),zoomLayer=$('zoom-layer');

let mode='m1',stream=null,facing='environment',mirror=false,camSeq=0,zoomVal=1.0;
let ghostOn=false, ghostUrl=null, isVidGhost=false;

const ovShow=t=>{$('ovm').textContent=t;$('ov').classList.remove('hidden')};
const ovHide=()=>$('ov').classList.add('hidden');

/* ---------- ズーム機能 ---------- */
function setZoom(val){
  zoomVal=parseFloat(val);
  $('zl').textContent=zoomVal.toFixed(1)+'x';
  if(stream){
    const track=stream.getVideoTracks()[0];
    if(track&&track.getCapabilities){
      const caps=track.getCapabilities();
      if(caps.zoom){
        const target=Math.max(caps.zoom.min,Math.min(caps.zoom.max,zoomVal));
        track.applyConstraints({advanced:[{zoom:target}]}).catch(()=>{});
      }
    }
  }
  zoomLayer.style.transform=`scale(${zoomVal})`;
}

/* ---------- カメラ制御 ---------- */
function stopStream(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}live.srcObject=null}
async function initCamera(){
  const my=++camSeq; stopStream();
  if(mode==='m3')return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){return}
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:false});
    if(my!==camSeq){s.getTracks().forEach(t=>t.stop());return}
    stream=s; live.srcObject=s; await live.play().catch(()=>{});
    setZoom(zoomVal);
    s.getVideoTracks()[0].onended=()=>{};
  }catch(e){}
}
function toggleCam(){facing=facing==='user'?'environment':'user';stopDelay();initCamera()}
function toggleMir(){
  mirror=!mirror;
  [live,dc,pb,ghostImg,ghostVid].forEach(e=>e.classList.toggle('mir',mirror));
  $('mirBtn').classList.toggle('on',mirror);
}

/* ---------- グリッド制御 ---------- */
let gridOn=false;
function toggleGrid(){
  gridOn=!gridOn;
  updateGridDisplay();
  $('gridBtn').classList.toggle('on',gridOn);
}
function updateGridDisplay(){
  const isSide=$('cmp').classList.contains('side');
  if(!gridOn){
    $('grid-main').classList.remove('on');
    $('grid-a').classList.remove('on');
    $('grid-b').classList.remove('on');
  } else {
    if(isSide){
      $('grid-main').classList.remove('on');
      $('grid-a').classList.add('on');
      $('grid-b').classList.add('on');
    } else {
      $('grid-main').classList.add('on');
      $('grid-a').classList.remove('on');
      $('grid-b').classList.remove('on');
    }
  }
}

document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible')return;
  if(delayOn)wakeOn();
  if(mode!=='m3'){const t=stream&&stream.getVideoTracks()[0];if(!t||t.readyState!=='live')initCamera()}
});

/* ---------- モード切替 ---------- */
function setMode(m){
  cancelRec(); stopDelay(); resetLive(); mode=m;
  ['m1','m2','m3'].forEach(k=>{$('n-'+k).classList.toggle('on',k===m);$('s-'+k).classList.toggle('hidden',k!==m)});
  const c=m==='m3';
  $('single').classList.toggle('hidden',c);$('cmp').classList.toggle('hidden',!c);
  $('camBtn').classList.toggle('hidden',c);$('mirBtn').classList.toggle('hidden',c);
  $('zoom-ctrl').classList.toggle('hidden',c);
  updateGridDisplay();
  if(c){camSeq++;stopStream();}else if(!stream)initCamera();
}

/* ---------- パネル開閉トグル用関数 ---------- */
function togglePanelMode(m){
  const content=$(`content-${m}`);
  const btn=$(`pt-${m}`);
  const h=content.classList.toggle('hidden');
  btn.textContent=h?'▲ 操作':'▼ 隠す';
}
function togglePanel(){
  const h=$('clips').classList.toggle('hidden');
  $('pt').textContent=h?'▲ 操作':'▼ 隠す';
}

/* ---------- モード1: 遅延モニター ---------- */
const FPS=20,CAP_W=854,QUALITY=.65;
let delayOn=false,buf=[],capT=0,rafId=0,capBusy=false,drawBusy=false,lastDrawn=null,wake=null,wasBuf=true;
const cc=document.createElement('canvas'),cctx=cc.getContext('2d');
const delaySec=()=>+$('dr').value;
async function wakeOn(){try{if(navigator.wakeLock)wake=await navigator.wakeLock.request('screen')}catch(e){}}
function wakeOff(){try{wake&&wake.release()}catch(e){}wake=null}
function setDelayUI(on){const b=$('db');b.textContent=on?'⏹ 遅延再生停止':'▶ 遅延再生開始';b.classList.toggle('pri',!on);b.classList.toggle('rec',on)}
function toggleDelay(){delayOn?stopDelay():startDelay()}
function startDelay(){
  if(!stream||!live.videoWidth)return;
  delayOn=true;buf=[];lastDrawn=null;wasBuf=true;
  dc.classList.remove('hidden');live.classList.add('vh');
  setDelayUI(true);wakeOn();capture();rafId=requestAnimationFrame(play);
}
function stopDelay(){
  delayOn=false;clearTimeout(capT);cancelAnimationFrame(rafId);buf=[];lastDrawn=null;wakeOff();
  dc.classList.add('hidden');live.classList.remove('vh');if(!cdT&&!(mr&&mr.state==='recording'))ovHide();setDelayUI(false);
}
function capture(){
  if(!delayOn)return;
  capT=setTimeout(capture,1000/FPS);
  if(capBusy||live.readyState<2||!live.videoWidth)return;
  capBusy=true;
  const w=Math.min(CAP_W,live.videoWidth),h=Math.round(w*live.videoHeight/live.videoWidth);
  if(cc.width!==w||cc.height!==h){cc.width=w;cc.height=h}
  cctx.drawImage(live,0,0,w,h);
  const t=performance.now();
  cc.toBlob(b=>{capBusy=false;if(b&&delayOn)buf.push({t,b})},'image/jpeg',QUALITY);
}
function play(){
  if(!delayOn)return;
  rafId=requestAnimationFrame(play);
  const now=performance.now(),d=delaySec()*1000,target=now-d;
  if(!buf.length||buf[0].t>target){
    const first=buf.length?buf[0].t:now;
    ovShow('遅延バッファ蓄積中… あと'+Math.max(1,Math.ceil((first+d-now)/1000))+'秒');wasBuf=true;return;
  }
  if(wasBuf){ovHide();wasBuf=false;}
  let i=0;while(i+1<buf.length&&buf[i+1].t<=target)i++;
  if(i>0)buf.splice(0,i);
  const f=buf[0];
  if(drawBusy||f===lastDrawn)return;
  lastDrawn=f;drawBusy=true;
  createImageBitmap(f.b).then(bm=>{
    if(delayOn){if(dc.width!==bm.width||dc.height!==bm.height){dc.width=bm.width;dc.height=bm.height}dctx.drawImage(bm,0,0)}
    bm.close();
  }).catch(()=>{}).finally(()=>{drawBusy=false});
}

/* ---------- モード2: 撮影 & 立ち位置透かし ---------- */
let mr=null,chunks=[],blob=null,blobUrl=null,cdT=null,maxT=null,discard=false;
const MAX_REC_SEC=120;
const pickType=()=>['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||'';

function toggleGhost(){
  ghostOn=!ghostOn;
  $('ghostBtn').textContent='👻 透かし'+(ghostOn?'ON':'OFF');
  $('ghostBtn').classList.toggle('on',ghostOn);
  updateGhostDisplay();
}
function setGhostOpacity(val){
  ghostImg.style.opacity=val;
  ghostVid.style.opacity=val;
}
function loadGhostFile(ev){
  const f=ev.target.files[0]; if(!f)return;
  if(ghostUrl) URL.revokeObjectURL(ghostUrl);
  ghostUrl=URL.createObjectURL(f);
  isVidGhost=f.type.startsWith('video/');
  if(isVidGhost){
    ghostVid.src=ghostUrl; ghostVid.play().catch(()=>{});
  } else {
    ghostImg.src=ghostUrl;
  }
  ghostOn=true;
  $('ghostBtn').textContent='👻 透かしON'; $('ghostBtn').classList.add('on');
  updateGhostDisplay();
}
function updateGhostDisplay(){
  const show=ghostOn && mode==='m2';
  ghostImg.classList.toggle('hidden', !show || isVidGhost);
  ghostVid.classList.toggle('hidden', !show || !isVidGhost);
}

function setRecUI(s){
  const b=$('rb');b.disabled=s==='prev';
  b.textContent={idle:'🔴 撮影開始',count:'✖ キャンセル',rec:'⏹ 録画停止',prev:'🔴 撮影開始'}[s];
  $('rs').classList.toggle('hidden',s!=='prev');$('sv').disabled=s!=='prev';
  $('camBtn').disabled=(s==='count'||s==='rec');
}
function recClick(){
  if(mr&&mr.state==='recording')return stopRec();
  if(cdT){cancelRec();setRecUI('idle');return}
  if(!stream)return;
  let c=+$('tr').value;setRecUI('count');
  if(c<=0)return doRec();
  ovShow('撮影開始まで '+c+' 秒');
  cdT=setInterval(()=>{c--;
    if(c>0){ovShow('撮影開始まで '+c+' 秒');}
    else{clearInterval(cdT);cdT=null;ovHide();doRec()}},1000);
}
function doRec(){
  chunks=[];discard=false;const type=pickType();
  try{mr=new MediaRecorder(stream,type?{mimeType:type,videoBitsPerSecond:4e6}:{videoBitsPerSecond:4e6})}
  catch(e){
    try{mr=new MediaRecorder(stream)}catch(err){setRecUI('idle');return}
  }
  const rec=mr;
  rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  rec.onstop=()=>{
    clearTimeout(maxT);$('rec').classList.add('hidden');
    if(discard||!chunks.length){chunks=[];setRecUI('idle');return}
    blob=new Blob(chunks,{type:(rec.mimeType||type||'video/mp4').split(';')[0]});chunks=[];
    revoke();blobUrl=URL.createObjectURL(blob);
    
    ghostUrl=blobUrl; isVidGhost=true; ghostVid.src=ghostUrl; ghostVid.play().catch(()=>{});
    ghostOn=true; $('ghostBtn').textContent='👻 透かしON'; $('ghostBtn').classList.add('on');

    live.classList.add('hidden');pb.classList.remove('hidden');pb.src=blobUrl;pb.play().catch(()=>{});
    setRecUI('prev');
  };
  rec.start(1000);
  $('rec').classList.remove('hidden');setRecUI('rec');
  maxT=setTimeout(stopRec,MAX_REC_SEC*1000);
}
function stopRec(){if(mr&&mr.state==='recording')mr.stop()}
function cancelRec(){
  clearInterval(cdT);cdT=null;clearTimeout(maxT);ovHide();
  if(mr&&mr.state==='recording'){discard=true;mr.stop()}
  $('rec').classList.add('hidden');
}
function revoke(){if(blobUrl&&blobUrl!==ghostUrl){URL.revokeObjectURL(blobUrl);blobUrl=null}}
function resetLive(){
  pb.pause();pb.removeAttribute('src');pb.load();pb.classList.add('hidden');
  live.classList.remove('hidden');revoke();blob=null;setRecUI('idle');
  updateGhostDisplay();
}
function retake(){resetLive()}
pb.onclick=()=>{pb.paused?pb.play():pb.pause()};
function save(){
  if(!blob)return;
  const d=new Date(),p=n=>String(n).padStart(2,'0'),ext=blob.type.includes('mp4')?'mp4':'webm';
  const filename=`kyudo_m2_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.${ext}`;
  const a=document.createElement('a');a.href=blobUrl;a.download=filename;
  document.body.appendChild(a);a.click();a.remove();
}

/* ---------- モード3: 比較 & A-Bリピート範囲設定 ---------- */
const V=t=>t==='a'?va:vb;
const bounds={a:{in:0,out:Infinity},b:{in:0,out:Infinity}};

function loadV(t,ev){
  const f=ev.target.files[0];if(!f)return;
  const v=V(t);if(v.dataset.u)URL.revokeObjectURL(v.dataset.u);
  v.dataset.u=URL.createObjectURL(f);v.src=v.dataset.u;
  v.onloadedmetadata=()=>fixDur(v,()=>{
    const s=$('sk-'+t);s.max=v.duration;s.value=0;
    bounds[t]={in:0,out:v.duration};
    $(`in-txt-${t}`).textContent='0.0s';
    $(`out-txt-${t}`).textContent=v.duration.toFixed(1)+'s';
  });
  v.ontimeupdate=()=>{
    $('sk-'+t).value=v.currentTime;
    if(v.currentTime>=bounds[t].out){
      v.currentTime=bounds[t].in;
    }
  };
  ev.target.value='';
}
function fixDur(v,cb){
  if(v.duration===Infinity){v.onseeked=()=>{v.onseeked=null;v.currentTime=0;cb()};v.currentTime=1e101}else cb();
}
function seekV(t,x){V(t).currentTime=+x}
function step(t,sec){const v=V(t);if(!v.src)return;v.pause();v.currentTime=Math.max(0,Math.min(v.duration||0,v.currentTime+sec))}
function mirV(t){const v=V(t),on=v.classList.toggle('mir');$(t==='a'?'ma':'mb').classList.toggle('on',on)}

function setLoopBound(t,type){
  const v=V(t); if(!v.src)return;
  if(type==='in'){
    bounds[t].in=v.currentTime;
    $(`in-txt-${t}`).textContent=v.currentTime.toFixed(1)+'s';
  }else{
    bounds[t].out=v.currentTime;
    $(`out-txt-${t}`).textContent=v.currentTime.toFixed(1)+'s';
  }
}
function resetLoop(t){
  const v=V(t);
  bounds[t]={in:0,out:v.duration||Infinity};
  $(`in-txt-${t}`).textContent='0.0s';
  $(`out-txt-${t}`).textContent=(v.duration||0).toFixed(1)+'s';
}

function toggleView(){
  const isSide=$('cmp').classList.toggle('side');
  const boxB=$('box-b');
  const boxA=$('box-a');
  if(isSide){
    boxB.style.display='block';
    boxB.appendChild(vb);
    $('vm').textContent='🔲 重ね表示';
  }else{
    boxB.style.display='none';
    boxA.appendChild(vb);
    $('vm').textContent='🔲 並列表示';
  }
  updateGridDisplay();
}

async function syncPlay(){
  const vs=[{id:'a',v:va},{id:'b',v:vb}].filter(o=>o.v.src);
  if(!vs.length)return;
  const isPlaying=vs.some(o=>!o.v.paused);
  if(isPlaying){
    vs.forEach(o=>o.v.pause());
  }else{
    vs.forEach(o=>{
      if(o.v.currentTime<bounds[o.id].in || o.v.currentTime>=bounds[o.id].out){
        o.v.currentTime=bounds[o.id].in;
      }
    });
    await Promise.all(vs.map(o=>o.v.play().catch(()=>{})));
  }
}

window.onload=()=>setMode('m1');
</script>
